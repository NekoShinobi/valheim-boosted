name: Build mod
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Thunderstore metadata and packaging
        run: |
          python3 scripts/package-mod.py --check
          python3 -m unittest discover -s tests/packaging -v
          python3 -m unittest discover -s tests/ci -v
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check managed telemetry components
        run: dotnet run --project tests/TelemetryChecks/TelemetryChecks.csproj
      - name: Download dedicated-server build references
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 mono-runtime libmono-system-core4.0-cil libmono-system4.0-cil
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/valheim"
          curl --fail --location --retry 3 https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          bash scripts/install-server-references.sh "$RUNNER_TEMP/steamcmd/steamcmd.sh" "$RUNNER_TEMP/valheim"
          python3 scripts/prepare-ci.py "$RUNNER_TEMP/valheim"
      - name: Build and package
        id: package
        run: |
          dotnet run --project tests/TelemetryChecks/TelemetryChecks.csproj -- .local/references/Managed/assembly_valheim.dll
          dotnet build tests/IntegrationChecks/IntegrationChecks.csproj -p:RestoreLockedMode=true
          mono tests/IntegrationChecks/bin/Debug/net48/IntegrationChecks.exe
          dotnet build tests/GameContractChecks/GameContractChecks.csproj -p:RestoreLockedMode=true
          mono tests/GameContractChecks/bin/Debug/net48/GameContractChecks.exe .local/references/Managed
          dotnet restore mod/ValheimBoosted.csproj --locked-mode
          dotnet build mod/ValheimBoosted.csproj --configuration Release --no-restore
          python3 scripts/package-mod.py
      - name: Upload Thunderstore package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.package_path }}
          # Upload the ready-to-install ZIP itself, without a second ZIP wrapper.
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload direct plugin-install package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.plugins_package_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
