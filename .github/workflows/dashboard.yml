name: Build metrics image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        run: python3 scripts/package-mod.py --check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/valheim-boosted-metrics" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          # Keep latest as the existing main-branch channel. A numeric pre-release
          # must not become latest through metadata-action's semver auto-tagging.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        name: Build image for smoke test
        with:
          context: .
          file: docker/metrics.Dockerfile
          platforms: linux/amd64
          load: true
          tags: valheim-boosted-metrics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container
        shell: bash
        run: |
          docker run -d --name metrics-check --read-only --tmpfs /tmp \
            --mount type=volume,source=metrics-check-reports,target=/reports \
            -p 127.0.0.1:18080:8080 valheim-boosted-metrics:ci
          # Docker can reset connections before Bun starts listening; retry those too.
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 1 --retry-max-time 30 --connect-timeout 2 --max-time 5 \
            --output /dev/null http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/api/metrics | jq -e '.status == "waiting"'
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/ | grep -q 'valheim-boosted'
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/reports | grep -q 'valheim-boosted'
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/history | grep -q 'valheim-boosted'
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/api/history/status | jq -e '.retentionDays == 7 and .error == null'
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/api/reports | jq -e '.reports == [] and .unreadable == 0'
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:18080/api/recording/reset | jq -e '.recording.snapshots == 0'
          docker exec metrics-check bun -e 'await Bun.write("/reports/.write-check", "ok"); if (await Bun.file("/reports/.write-check").text() !== "ok") process.exit(1); await Bun.file("/reports/.write-check").delete()'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs metrics-check || true
          docker rm -f metrics-check || true
          docker volume rm metrics-check-reports || true
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        name: Publish checked image
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: docker/metrics.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
